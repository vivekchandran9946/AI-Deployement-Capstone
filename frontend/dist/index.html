<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <!-- Vite module entry -->

  <!-- Standalone Browser Script with Dynamic Theme Toggle & Graphical Cards -->
  <script type="text/babel">
    if (!window.__vite_plugin_react_preamble_installed__) {
      const { useState, useEffect } = React;

      function StandaloneApp() {
        const [isDarkMode, setIsDarkMode] = useState(false);
        const [activeTab, setActiveTab] = useState('predict');
        
        const [formData, setFormData] = useState({
          gender: 'Female',
          SeniorCitizen: 0,
          Partner: 'No',
          Dependents: 'No',
          tenure: 3,
          PhoneService: 'Yes',
          MultipleLines: 'Yes',
          InternetService: 'Fiber optic',
          OnlineSecurity: 'No',
          OnlineBackup: 'No',
          DeviceProtection: 'No',
          TechSupport: 'No',
          StreamingTV: 'Yes',
          StreamingMovies: 'Yes',
          Contract: 'Month-to-month',
          PaperlessBilling: 'Yes',
          PaymentMethod: 'Electronic check',
          MonthlyCharges: 98.85,
          TotalCharges: 296.55,
        });

        const [predictionResult, setPredictionResult] = useState(null);
        const [isLoading, setIsLoading] = useState(false);
        const [isBackendOnline, setIsBackendOnline] = useState(null);
        const [useDemoMode, setUseDemoMode] = useState(false);
        const [hasError, setHasError] = useState(false);
        const [predictionCount, setPredictionCount] = useState(0);

        // Toggle Dark class on html element
        useEffect(() => {
          if (isDarkMode) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }, [isDarkMode]);

        const checkBackend = async () => {
          try {
            await axios.options('http://127.0.0.1:8000/predict', { timeout: 2000 }).catch(() => axios.get('http://127.0.0.1:8000/', { timeout: 2000 }));
            setIsBackendOnline(true);
            setHasError(false);
          } catch (e) {
            setIsBackendOnline(false);
          }
        };

        useEffect(() => {
          checkBackend();
        }, []);

        const handleFieldChange = (field, value) => {
          let updated = { ...formData, [field]: value };
          if (field === 'tenure' || field === 'MonthlyCharges') {
            updated.TotalCharges = Number((updated.tenure * updated.MonthlyCharges).toFixed(2));
          }
          setFormData(updated);
        };

        const runMockInference = (data) => {
          let score = 30;
          if (data.Contract === 'Month-to-month') score += 32;
          if (data.Contract === 'Two year') score -= 25;
          if (data.tenure <= 6) score += 25;
          if (data.InternetService === 'Fiber optic') score += 12;
          if (data.PaymentMethod === 'Electronic check') score += 14;

          const churnProb = Math.max(5, Math.min(95, score));
          const stayProb = 100 - churnProb;
          const isChurn = churnProb > 50;

          return {
            prediction: isChurn ? "Customer is likely to Churn" : "Customer is likely to Stay",
            prediction_code: isChurn ? 1 : 0,
            probability_stay: stayProb,
            probability_churn: churnProb,
            recommendation: isChurn 
              ? "High attrition risk detected. Offer 15% discount migration from Month-to-Month to a 1-Year or 2-Year Contract with free Tech Support."
              : "Customer retention is stable. Continue standard engagement and introduce loyalty streaming package rewards."
          };
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          setIsLoading(true);
          setHasError(false);

          if (useDemoMode) {
            setTimeout(() => {
              setPredictionResult(runMockInference(formData));
              setIsLoading(false);
              setPredictionCount(c => c + 1);
            }, 800);
            return;
          }

          try {
            const resp = await axios.post('http://127.0.0.1:8000/predict', formData, {
              headers: { 'Content-Type': 'application/json' },
              timeout: 6000
            });
            setPredictionResult(resp.data);
            setIsBackendOnline(true);
            setIsLoading(false);
            setPredictionCount(c => c + 1);
          } catch (err) {
            setIsBackendOnline(false);
            setIsLoading(false);
            setHasError(true);
          }
        };

        const downloadReport = () => {
          if (!predictionResult) return;
          const txt = `CONNECTTEL AI PREDICTION REPORT\nDate: ${new Date().toLocaleString()}\nOutcome: ${predictionResult.prediction}\nStay Prob: ${predictionResult.probability_stay}%\nChurn Prob: ${predictionResult.probability_churn}%\nRecommendation: ${predictionResult.recommendation}`;
          const blob = new Blob([txt], { type: 'text/plain' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `ConnectTel_Report_${Date.now()}.txt`;
          a.click();
        };

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">
            
            {/* Top Navigation Bar with Prominent Theme Switcher */}
            <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800 px-6 py-4 flex items-center justify-between shadow-xs">
              <div className="flex items-center space-x-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center text-white font-black shadow-lg shadow-blue-500/30">
                  CT
                </div>
                <div>
                  <h1 className="text-xl font-black text-slate-900 dark:text-white">ConnectTel <span className="text-blue-600 dark:text-cyan-400">AI</span></h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Customer Churn Intelligence Dashboard</p>
                </div>
              </div>

              {/* Action Controls & Theme Toggle */}
              <div className="flex items-center space-x-3">
                
                {/* Connection Status Pill */}
                <div className="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">
                  <span className={`w-2.5 h-2.5 rounded-full ${isBackendOnline ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                  <span>{useDemoMode ? 'Demo Engine' : isBackendOnline ? 'FastAPI Connected' : 'Offline'}</span>
                </div>

                {/* PROMINENT LIGHT / DARK THEME TOGGLE BUTTON */}
                <button 
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="px-4 py-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-xs shadow-md shadow-blue-500/20 flex items-center gap-2 cursor-pointer transition transform hover:scale-105"
                  title="Toggle Light or Dark Theme"
                >
                  <span>{isDarkMode ? '☀️ Switch to Light Theme' : '🌙 Switch to Dark Theme'}</span>
                </button>

              </div>
            </header>

            {/* Main Content Area */}
            <div className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
              
              {/* Graphical Hero Banner Card */}
              <div className="relative overflow-hidden bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-600 text-white rounded-3xl p-8 shadow-2xl shadow-blue-500/20 border border-blue-400/30">
                <div className="relative z-10 space-y-2 max-w-2xl">
                  <span className="inline-block px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-white/20 backdrop-blur-md border border-white/30 text-cyan-200">
                    Enterprise Retention Analytics
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-black">
                    AI Customer Churn Prediction
                  </h2>
                  <p className="text-sm text-blue-100 font-medium leading-relaxed">
                    Evaluate 19 customer features including demographics, fiber optic subscription, contract tenure, and monthly billing to predict customer retention probability.
                  </p>
                </div>
              </div>

              {/* Offline Warning Banner */}
              {hasError && (
                <div className="bg-rose-50 dark:bg-rose-950/60 border-2 border-rose-200 dark:border-rose-800 p-6 rounded-3xl space-y-3 shadow-xl">
                  <h3 className="text-lg font-black text-rose-900 dark:text-rose-200">Unable to connect to AI Prediction Server.</h3>
                  <p className="text-xs text-slate-600 dark:text-slate-300">Please verify FastAPI server is listening at http://127.0.0.1:8000/predict</p>
                  <div className="flex gap-3 pt-1">
                    <button onClick={checkBackend} className="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-xs font-bold shadow-md">
                      Retry Connection
                    </button>
                    <button 
                      onClick={() => {
                        setUseDemoMode(true);
                        setHasError(false);
                        setPredictionResult(runMockInference(formData));
                      }} 
                      className="px-5 py-2.5 bg-slate-900 text-cyan-300 rounded-2xl text-xs font-bold shadow-md"
                    >
                      Enable Demo Engine
                    </button>
                  </div>
                </div>
              )}

              {/* GRAPHICAL CUSTOMER FORM (Curved Modern Cards with Gradient Borders) */}
              <form onSubmit={handleSubmit} className="space-y-8">
                
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  
                  {/* CARD 1: DEMOGRAPHICS (Gradient Border Glass Card) */}
                  <div className="p-[1.5px] rounded-3xl bg-gradient-to-b from-blue-500/40 via-indigo-500/20 to-transparent shadow-xl">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 space-y-5 h-full">
                      <div className="flex items-center space-x-3 pb-3 border-b border-slate-100 dark:border-slate-800">
                        <div className="w-10 h-10 rounded-2xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-cyan-400 flex items-center justify-center font-black">
                          👤
                        </div>
                        <div>
                          <h3 className="font-black text-base text-slate-900 dark:text-white">Demographics</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400">Personal & family details</p>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Gender</label>
                        <div className="grid grid-cols-2 gap-2">
                          {['Male', 'Female'].map(g => (
                            <button
                              type="button" key={g}
                              onClick={() => handleFieldChange('gender', g)}
                              className={`py-2.5 px-3 text-xs font-bold rounded-xl border transition ${formData.gender === g ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                            >
                              {g}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Senior Citizen</label>
                        <div className="grid grid-cols-2 gap-2">
                          {[{label:'No (Under 65)',val:0},{label:'Yes (65+)',val:1}].map(opt => (
                            <button
                              type="button" key={opt.val}
                              onClick={() => handleFieldChange('SeniorCitizen', opt.val)}
                              className={`py-2.5 px-3 text-xs font-bold rounded-xl border transition ${formData.SeniorCitizen === opt.val ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                            >
                              {opt.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Partner</label>
                        <div className="grid grid-cols-2 gap-2">
                          {['Yes', 'No'].map(opt => (
                            <button
                              type="button" key={opt}
                              onClick={() => handleFieldChange('Partner', opt)}
                              className={`py-2.5 px-3 text-xs font-bold rounded-xl border transition ${formData.Partner === opt ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Dependents</label>
                        <div className="grid grid-cols-2 gap-2">
                          {['Yes', 'No'].map(opt => (
                            <button
                              type="button" key={opt}
                              onClick={() => handleFieldChange('Dependents', opt)}
                              className={`py-2.5 px-3 text-xs font-bold rounded-xl border transition ${formData.Dependents === opt ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>

                    </div>
                  </div>

                  {/* CARD 2: TELECOM & SERVICES */}
                  <div className="p-[1.5px] rounded-3xl bg-gradient-to-b from-cyan-500/40 via-blue-500/20 to-transparent shadow-xl">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 space-y-4 h-full">
                      <div className="flex items-center space-x-3 pb-3 border-b border-slate-100 dark:border-slate-800">
                        <div className="w-10 h-10 rounded-2xl bg-cyan-50 dark:bg-cyan-950 text-cyan-600 dark:text-cyan-400 flex items-center justify-center font-black">
                          📶
                        </div>
                        <div>
                          <h3 className="font-black text-base text-slate-900 dark:text-white">Subscribed Services</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400">Internet & add-ons</p>
                        </div>
                      </div>

                      <div className="space-y-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Internet Service Provider</label>
                          <select 
                            value={formData.InternetService} 
                            onChange={e => handleFieldChange('InternetService', e.target.value)}
                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2.5 text-xs font-bold"
                          >
                            <option value="Fiber optic">Fiber optic (High Speed)</option>
                            <option value="DSL">DSL (Standard)</option>
                            <option value="No">No Internet Service</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Phone Service</label>
                          <select 
                            value={formData.PhoneService} 
                            onChange={e => handleFieldChange('PhoneService', e.target.value)}
                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2.5 text-xs font-bold"
                          >
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                          </select>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">Online Security</label>
                            <select 
                              value={formData.OnlineSecurity} 
                              onChange={e => handleFieldChange('OnlineSecurity', e.target.value)}
                              className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                            >
                              <option value="Yes">Yes</option>
                              <option value="No">No</option>
                              <option value="No internet service">No internet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">Tech Support</label>
                            <select 
                              value={formData.TechSupport} 
                              onChange={e => handleFieldChange('TechSupport', e.target.value)}
                              className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                            >
                              <option value="Yes">Yes</option>
                              <option value="No">No</option>
                              <option value="No internet service">No internet</option>
                            </select>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">Streaming TV</label>
                            <select 
                              value={formData.StreamingTV} 
                              onChange={e => handleFieldChange('StreamingTV', e.target.value)}
                              className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                            >
                              <option value="Yes">Yes</option>
                              <option value="No">No</option>
                              <option value="No internet service">No internet</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">Streaming Movies</label>
                            <select 
                              value={formData.StreamingMovies} 
                              onChange={e => handleFieldChange('StreamingMovies', e.target.value)}
                              className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                            >
                              <option value="Yes">Yes</option>
                              <option value="No">No</option>
                              <option value="No internet service">No internet</option>
                            </select>
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>

                  {/* CARD 3: CONTRACT & BILLING */}
                  <div className="p-[1.5px] rounded-3xl bg-gradient-to-b from-indigo-500/40 via-purple-500/20 to-transparent shadow-xl">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 space-y-5 h-full">
                      <div className="flex items-center space-x-3 pb-3 border-b border-slate-100 dark:border-slate-800">
                        <div className="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-black">
                          💳
                        </div>
                        <div>
                          <h3 className="font-black text-base text-slate-900 dark:text-white">Contract & Charges</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400">Tenure & billing metrics</p>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-xs font-bold text-slate-700 dark:text-slate-300">Tenure ({formData.tenure} Months)</label>
                          <span className="px-2.5 py-0.5 text-xs font-black rounded-lg bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-cyan-400">
                            {(formData.tenure / 12).toFixed(1)} yrs
                          </span>
                        </div>
                        <input 
                          type="range" min="0" max="72" 
                          value={formData.tenure} 
                          onChange={e => handleFieldChange('tenure', parseInt(e.target.value) || 0)}
                          className="w-full accent-blue-600"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Contract Type</label>
                        <select 
                          value={formData.Contract} 
                          onChange={e => handleFieldChange('Contract', e.target.value)}
                          className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2.5 text-xs font-bold"
                        >
                          <option value="Month-to-month">Month-to-month</option>
                          <option value="One year">One year</option>
                          <option value="Two year">Two year</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Payment Method</label>
                        <select 
                          value={formData.PaymentMethod} 
                          onChange={e => handleFieldChange('PaymentMethod', e.target.value)}
                          className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2.5 text-xs font-bold"
                        >
                          <option value="Electronic check">Electronic check</option>
                          <option value="Mailed check">Mailed check</option>
                          <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                          <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-bold mb-1 text-slate-700 dark:text-slate-300">Monthly ($)</label>
                          <input 
                            type="number" step="0.1" 
                            value={formData.MonthlyCharges} 
                            onChange={e => handleFieldChange('MonthlyCharges', parseFloat(e.target.value) || 0)}
                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold mb-1 text-slate-700 dark:text-slate-300">Total ($)</label>
                          <input 
                            type="number" step="1" 
                            value={formData.TotalCharges} 
                            onChange={e => handleFieldChange('TotalCharges', parseFloat(e.target.value) || 0)}
                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-2 text-xs font-bold"
                          />
                        </div>
                      </div>

                    </div>
                  </div>

                </div>

                {/* Large Gradient CTA Submit Button */}
                <div className="flex justify-center pt-2">
                  <button 
                    type="submit" 
                    disabled={isLoading}
                    className="w-full sm:w-auto px-12 py-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white font-black text-base rounded-2xl shadow-xl shadow-blue-500/30 transition transform hover:scale-[1.02] cursor-pointer"
                  >
                    {isLoading ? "Analyzing customer behaviour..." : "Predict Customer Churn"}
                  </button>
                </div>
              </form>

              {/* GRAPHICAL RESULTS DASHBOARD */}
              {predictionResult && !hasError && (
                <div className="space-y-6 animate-fade-in">
                  
                  {/* Large Status Card with Gradient Header */}
                  <div className={`p-8 rounded-3xl border-2 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-6 text-white ${
                    predictionResult.prediction_code === 0 
                      ? 'bg-gradient-to-r from-emerald-600 via-teal-700 to-slate-900 border-emerald-400'
                      : 'bg-gradient-to-r from-rose-600 via-red-700 to-slate-900 border-rose-400'
                  }`}>
                    <div>
                      <span className="text-xs font-black uppercase tracking-widest opacity-80">AI Model Output</span>
                      <h2 className="text-3xl sm:text-4xl font-black mt-1">{predictionResult.prediction}</h2>
                    </div>
                    <button 
                      onClick={downloadReport}
                      className="px-6 py-3.5 bg-white text-slate-900 hover:bg-slate-100 font-extrabold rounded-2xl text-xs shadow-xl shrink-0 transition"
                    >
                      Download Prediction Report
                    </button>
                  </div>

                  {/* 3 KPI CARDS */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-lg">
                      <span className="text-xs font-black text-slate-400 uppercase">Stay Probability</span>
                      <div className="text-4xl font-black text-emerald-600 dark:text-emerald-400 mt-2">{predictionResult.probability_stay}%</div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-lg">
                      <span className="text-xs font-black text-slate-400 uppercase">Churn Probability</span>
                      <div className="text-4xl font-black text-rose-600 dark:text-rose-400 mt-2">{predictionResult.probability_churn}%</div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-lg">
                      <span className="text-xs font-black text-slate-400 uppercase">Risk Level</span>
                      <div className="text-2xl font-black mt-2">
                        {predictionResult.probability_churn > 70 ? (
                          <span className="text-rose-600 dark:text-rose-400">HIGH RISK</span>
                        ) : predictionResult.probability_churn > 30 ? (
                          <span className="text-amber-600 dark:text-amber-400">MEDIUM RISK</span>
                        ) : (
                          <span className="text-emerald-600 dark:text-emerald-400">LOW RISK</span>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Recommendation Card */}
                  <div className="bg-gradient-to-r from-blue-900 via-slate-900 to-indigo-950 p-7 rounded-3xl border border-blue-500/30 text-white space-y-2 shadow-xl">
                    <h4 className="text-xs font-black uppercase text-cyan-300">AI Strategic Recommendation</h4>
                    <p className="text-base font-bold text-slate-100">"{predictionResult.recommendation}"</p>
                  </div>

                </div>
              )}

            </div>

            {/* Footer */}
            <footer className="bg-white dark:bg-slate-900 border-t border-slate-200/80 dark:border-slate-800 p-6 text-center text-xs text-slate-500 dark:text-slate-400 font-medium">
              ConnectTel AI • Powered by FastAPI • Machine Learning • Random Forest • Professional Dashboard v1.0
            </footer>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
    }
  </script>
</body>
</html>
